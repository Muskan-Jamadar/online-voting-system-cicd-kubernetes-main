apiVersion: apps/v1
kind: Deployment

metadata:
  name: voting-app
  namespace: voting-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: voting-app

  template:
    metadata:
      labels:
        app: voting-app

    spec:
      containers:
      - name: voting-app

        # Change this with your Docker Hub image
        image: jamadar21/vote:latest

        ports:
        - containerPort: 8080

        env:

        # Database URL
        - name: SPRING_DATASOURCE_URL
          value: jdbc:mysql://mysql-service:3306/votingdb

        # Database username from secret
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: username

        # Database password from secret
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: password

        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"

          limits:
            cpu: "500m"
            memory: "1Gi"